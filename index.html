<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Mark Analyzer</title>

  <link rel="stylesheet" href="index.css" />
  
</head>


<body>

  <div class="container">

    <h1>Student Mark Analyzer</h1>
    <p class="subtitle">
      Enter marks for each subject to calculate total and average.
    </p>

    <form id="markForm">

      <div class="input-group">
        <label for="maths">Mathematics</label>
        <input type="number" id="maths" placeholder="Enter Maths mark" required>
      </div>

      <div class="input-group">
        <label for="english">English</label>
        <input type="number" id="english" placeholder="Enter English mark" required>
      </div>

      <div class="input-group">
        <label for="science">Science</label>
        <input type="number" id="science" placeholder="Enter Science mark" required>
      </div>

      <div class="input-group">
        <label for="social">Social Science</label>
        <input type="number" id="social" placeholder="Enter Social Science mark" required>
      </div>

      <div class="input-group">
        <label for="computer">Computer Science</label>
        <input type="number" id="computer" placeholder="Enter Computer Science mark" required>
      </div>

      <div class="input-group">
        <label for="physics">Physics</label>
        <input type="number" id="physics" placeholder="Enter Physics mark" required>
      </div>

      <button type="submit">Submit</button>

    </form>

    <div id="result"></div>

  </div>
<script src="index.js"></script>
</body>
</html>
